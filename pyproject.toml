[project]
name = "nodd"
version = "0.1.0"
description = "Turn a task spec into a tiny, calibrated, browser-runnable classifier."
authors = [
    { name = "Michal Jach", email = "michaljach@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8.0",
    "model2vec>=0.9.0",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
]

[project.scripts]
nodd = "nodd.cli:app"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
