task: prompt_injection
description: >
  Decide whether a message sent to an AI assistant tries to hijack it: override
  its instructions, extract its hidden prompt or configuration, or make it
  ignore its rules.
input:
  type: text
  max_chars: 2000
output:
  type: choice
  labels:
    safe: A normal request, including ones that talk about prompts, AI or security, or correct the user's own earlier message.
    injection: Tries to override or cancel the assistant's instructions, reveal its system prompt or secrets, or remove its rules.
model:
  tier: encoder           # auto | static | encoder — auto = best fit within the download budget
  base: null
  quantization: q8
# PoC: inputs + labels in the CSV were written offline by Claude (in a coding session),
# standing in for synth + teacher. See comment_moderation.yaml for the real-teacher setup.
teacher:
  kind: csv
  path: examples/prompt_injection_data.csv
data:
  seed_examples: null
  unlabeled: examples/prompt_injection_data.csv
  synthetic: 0
targets:
  min_macro_f1: 0.90
  deploy: browser
  max_download_mb: 30       # tiny models only
  max_latency_ms: 100
escalation:
  target_precision: 0.97
