task: support_triage
description: >
  Route an incoming customer support message to the right queue.
input:
  type: text
  max_chars: 2000
output:
  type: choice
  labels:
    billing: Charges, refunds, invoices, plans, pricing, discounts and payment methods.
    bug: Something in the product is broken, crashes, shows errors or behaves wrongly.
    account: Login, passwords, 2FA, email or owner changes, access, security and account deletion.
    how_to: A question about how to use something the product already does.
    feature_request: Asks for something the product doesn't do yet, or suggests an improvement.
model:
  tier: auto              # auto | static | encoder — auto = smallest download meeting targets
  base: null
  quantization: q8
# PoC: inputs + labels in the CSV were written offline by Claude (in a coding session),
# standing in for synth + teacher. See comment_moderation.yaml for the real-teacher setup.
teacher:
  kind: csv
  path: examples/support_triage_data.csv
data:
  seed_examples: null
  unlabeled: examples/support_triage_data.csv
  synthetic: 0
targets:
  min_macro_f1: 0.90
  deploy: browser
  max_download_mb: 30       # tiny models only
  max_latency_ms: 100
escalation:
  target_precision: 0.97
