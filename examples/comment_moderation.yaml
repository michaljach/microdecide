task: comment_moderation
description: >
  Decide whether a user comment on a product blog is acceptable to publish.
input:
  type: text
  max_chars: 2000
output:
  type: choice
  labels:
    ok: Normal comment. Can be positive, negative or off topic, but harmless.
    spam: Ads, links to unrelated products or services, SEO junk, scams.
    toxic: Insults, harassment, threats or hate toward people or groups.
model:
  tier: encoder           # auto | encoder — both: best fit among encoder bases within the budget
  base: null              # e.g. sentence-transformers/all-MiniLM-L6-v2 with tier: encoder
  quantization: q8
# PoC: no API key yet. Inputs + labels in the CSV were written offline by Claude
# (in a coding session) standing in for synth + teacher. To use the real teacher:
#   teacher: {kind: llm, model: claude-haiku-4-5-20251001}  and  data.synthetic: 2000
teacher:
  kind: csv
  path: examples/comment_moderation_data.csv
data:
  seed_examples: null
  unlabeled: examples/comment_moderation_data.csv   # labels ignored here; `source` column = synthetic
  synthetic: 0
targets:
  min_macro_f1: 0.90
  deploy: browser
  max_download_mb: 30       # tiny models only
  max_latency_ms: 100
escalation:
  target_precision: 0.97
