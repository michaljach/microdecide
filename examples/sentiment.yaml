task: sentiment
description: >
  What feeling does the writer express about the thing they're talking about
  (a product, place, service or experience)?
input:
  type: text
  max_chars: 2000
output:
  type: choice
  labels:
    positive: Happy, satisfied, grateful or recommends it.
    neutral: Facts, questions, plans or mixed feelings with no clear lean.
    negative: Unhappy, disappointed, angry or warns others away. Includes sarcastic praise.
model:
  tier: auto              # auto | static | encoder — auto = best fit within the download budget
  base: null
  quantization: q8
# PoC: inputs + labels in the CSV were written offline by Claude (in a coding session),
# standing in for synth + teacher. See comment_moderation.yaml for the real-teacher setup.
teacher:
  kind: csv
  path: examples/sentiment_data.csv
data:
  seed_examples: null
  unlabeled: examples/sentiment_data.csv
  synthetic: 0
targets:
  min_macro_f1: 0.90
  deploy: browser
  max_download_mb: 30       # tiny models only
  max_latency_ms: 100
escalation:
  target_precision: 0.97
