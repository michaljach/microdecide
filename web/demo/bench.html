<h1>Benchmark</h1>
<p class="muted small" id="sub">running…</p>
<div class="scroll"><table id="table"></table></div>
<script type="module">
  import { benchTable, runBench } from "./bench.ts";
  import { MODEL_URL } from "./common.ts";
  const table = document.getElementById("table");
  const r = await runBench((rs) => (table.innerHTML = benchTable(rs)));
  document.getElementById("sub").textContent =
    `${MODEL_URL} · ${r.n} test inputs · crossOriginIsolated=${r.crossOriginIsolated} · WebGPU=${r.webgpu} · ${r.userAgent}`;
  window.__result = r;
</script>
